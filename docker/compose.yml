## Services that stay on Docker. k3s Traefik reaches the web ports on the
## proxy-tier gateway (172.18.0.1) through home/docker-apps.
##   docker -H ssh://kcfam compose -f docker/compose.yml up -d
name: kcfam

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.3.1@sha256:0e091dfce3068339c3e1d14382e6c34141e05cd589a1972ebd4d9a8e6b5d8969
    restart: unless-stopped
    environment:
      TZ: America/Chicago
    volumes:
      - homeassistant_config:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "172.18.0.1:8123:8123"
    networks: [proxy-tier]

  music-assistant:
    container_name: music-assistant
    image: ghcr.io/music-assistant/server:2.7.10@sha256:ddb29c49c8c889ea12b177720bf7a5a174a23377ed8f4619263ed135002d7f6e
    restart: unless-stopped
    environment:
      TZ: America/Chicago
    volumes:
      - music_assistant_data:/data
    ports:
      - "172.18.0.1:8095:8095"
      # Snapcast clients on the LAN connect here directly.
      - "4953:4953"
    networks: [proxy-tier]

volumes:
  homeassistant_config:
    external: true
    name: nextcloud_homeassistant_config
  music_assistant_data:
    external: true
    name: nextcloud_music_assistant_data

networks:
  proxy-tier:
    external: true
