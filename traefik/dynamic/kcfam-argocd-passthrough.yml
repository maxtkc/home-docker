# argocd.kcfam.us -> k3s (TLS passthrough), the alias for the gtfs ArgoCD UI.
# Uses the kcfam-k3s service from kcfam-new-passthrough.yml.
#
# No Go-template expressions in this file, comments included.
tcp:
  routers:
    kcfam-argocd-passthrough:
      rule: "HostSNI(`argocd.kcfam.us`)"
      priority: 1000
      entryPoints:
        - "websecure"
      tls:
        passthrough: true
      service: "kcfam-k3s"
