# nc.kcfam.us -> k3s (TLS passthrough), the page pointing away from Nextcloud.
# Uses the kcfam-k3s service from kcfam-new-passthrough.yml.
#
# No Go-template expressions in this file, comments included.
tcp:
  routers:
    kcfam-nc-passthrough:
      rule: "HostSNI(`nc.kcfam.us`)"
      priority: 1000
      entryPoints:
        - "websecure"
      tls:
        passthrough: true
      service: "kcfam-k3s"
