# *.new.kcfam.us -> k3s (TLS passthrough)
#
# Parallel-run names for services moving to k3s. cert-manager in the cluster
# holds the *.new.kcfam.us wildcard; nothing here terminates them.
#
# 172.18.0.1 is the proxy-tier bridge gateway, where k3s Traefik listens on 8443.
# Priority 1000 for the same reason as gtfs-zone-passthrough.yml.
#
# No Go-template expressions in this file, comments included: the file provider
# templates the whole file and drops it silently on an error.
tcp:
  services:
    kcfam-k3s:
      loadBalancer:
        servers:
          - address: "172.18.0.1:8443"

  routers:
    kcfam-new-passthrough:
      rule: "HostSNIRegexp(`^.+\\.new\\.kcfam\\.us$`)"
      priority: 1000
      entryPoints:
        - "websecure"
      tls:
        passthrough: true
      service: "kcfam-k3s"
