## nginx serving max.kcfam.us from the nextcloud_static_sites Docker volume.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-static-sites
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/maxtkc/home-docker.git
    targetRevision: main
    path: home/static-sites
  destination:
    server: https://kubernetes.default.svc
    namespace: home
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
