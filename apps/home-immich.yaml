## Immich (server, machine learning, Postgres, Redis). Holds *.enc.yaml, so it renders through the ksops CMP.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-immich
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/maxtkc/kcfam-infra.git
    targetRevision: main
    path: home/immich
  destination:
    server: https://kubernetes.default.svc
    namespace: home
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
