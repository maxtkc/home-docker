## Static page for nc.kcfam.us pointing at Immich and File Browser.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-nc-pointer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/maxtkc/home-docker.git
    targetRevision: main
    path: home/nc-pointer
  destination:
    server: https://kubernetes.default.svc
    namespace: home
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
