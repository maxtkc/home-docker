## Secrets, PrometheusRules, dashboard and routes for home-monitoring. Wave 3, after
## the chart has installed the CRDs. Holds *.enc.yaml, so it renders through the ksops CMP.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-monitoring-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/maxtkc/home-docker.git
    targetRevision: main
    path: home/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: home
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
