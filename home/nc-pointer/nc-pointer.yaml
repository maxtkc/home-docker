## nginx serving one page that links to the services replacing Nextcloud.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nc-pointer
  namespace: home
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Nextcloud has moved</title>
      <style>
        body { font: 18px/1.5 system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; color: #222; background: #fff; }
        a { color: #0b5cad; }
        @media (prefers-color-scheme: dark) { body { color: #ddd; background: #161616; } a { color: #6fb0ff; } }
      </style>
    </head>
    <body>
      <h1>Nextcloud has moved</h1>
      <ul>
        <li>Photos and videos: <a href="https://im.kcfam.us">im.kcfam.us</a></li>
        <li>Files: <a href="https://files.kcfam.us">files.kcfam.us</a></li>
      </ul>
    </body>
    </html>
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location / { try_files /index.html =404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nc-pointer
  namespace: home
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nc-pointer
  template:
    metadata:
      labels:
        app: nc-pointer
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - { name: page, mountPath: /usr/share/nginx/html/index.html, subPath: index.html }
            - { name: page, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
      volumes:
        - name: page
          configMap:
            name: nc-pointer
---
apiVersion: v1
kind: Service
metadata:
  name: nc-pointer
  namespace: home
spec:
  selector:
    app: nc-pointer
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nc-pointer-new
  namespace: home
  annotations:
    external-dns.alpha.kubernetes.io/target: kcfam.us
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`nc.new.kcfam.us`)
      kind: Rule
      services:
        - name: nc-pointer
          port: 80
  tls:
    secretName: new-kcfam-us-tls
---
## nc.kcfam.us is reached through a per-host passthrough in Docker Traefik. Its
## CNAME predates external-dns, so this route carries no target annotation.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nc-pointer
  namespace: home
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`nc.kcfam.us`)
      kind: Rule
      services:
        - name: nc-pointer
          port: 80
  tls:
    secretName: nc-kcfam-us-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nc-kcfam-us-tls
  namespace: home
spec:
  secretName: nc-kcfam-us-tls
  dnsNames:
    - nc.kcfam.us
  issuerRef:
    name: letsencrypt-porkbun
    kind: ClusterIssuer
