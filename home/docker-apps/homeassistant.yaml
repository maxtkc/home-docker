## homeassistant runs on Docker (docker/compose.yml), published on the proxy-tier gateway.
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: home
spec:
  ports:
    - name: http
      port: 8123
      targetPort: 8123
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: homeassistant
  namespace: home
  labels:
    kubernetes.io/service-name: homeassistant
addressType: IPv4
ports:
  - name: http
    port: 8123
    protocol: TCP
endpoints:
  - addresses: ["172.18.0.1"]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homeassistant-new
  namespace: home
  annotations:
    external-dns.alpha.kubernetes.io/target: kcfam.us
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`ha.new.kcfam.us`)
      kind: Rule
      services:
        - name: homeassistant
          port: 8123
  tls:
    secretName: new-kcfam-us-tls
---
## ha.kcfam.us's CNAME predates external-dns, so this route carries no target
## annotation.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homeassistant
  namespace: home
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`ha.kcfam.us`)
      kind: Rule
      services:
        - name: homeassistant
          port: 8123
  tls:
    secretName: ha-kcfam-us-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ha-kcfam-us-tls
  namespace: home
spec:
  secretName: ha-kcfam-us-tls
  dnsNames:
    - ha.kcfam.us
  issuerRef:
    name: letsencrypt-porkbun
    kind: ClusterIssuer
