## gramps.kcfam.us's CNAME predates external-dns, so this route carries no target annotation.
## GrampsWeb has no OIDC, so it sits behind oauth2-proxy and keeps its own login.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grampsweb
  namespace: home
spec:
  entryPoints: [websecure]
  routes:
    # oauth2-proxy's own endpoints bypass forwardAuth.
    - match: Host(`gramps.kcfam.us`) && PathPrefix(`/oauth2/`)
      kind: Rule
      services:
        - name: oauth2-proxy
          port: 4180
    - match: Host(`gramps.kcfam.us`)
      kind: Rule
      middlewares:
        - name: oauth2-errors
        - name: oauth2-family
      services:
        - name: grampsweb
          port: 80
  tls:
    secretName: gramps-kcfam-us-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gramps-kcfam-us-tls
  namespace: home
spec:
  secretName: gramps-kcfam-us-tls
  dnsNames:
    - gramps.kcfam.us
  issuerRef:
    name: letsencrypt-porkbun
    kind: ClusterIssuer
