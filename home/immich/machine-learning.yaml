apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.3.1
          env:
            # Optimized re-exports of the same models; embeddings are unchanged.
            - name: MACHINE_LEARNING_MODEL_REVISION
              value: v2
          ports:
            - containerPort: 3003
          readinessProbe:
            httpGet:
              path: /ping
              port: 3003
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 6Gi
          volumeMounts:
            - { name: cache, mountPath: /cache }
      volumes:
        - name: cache
          hostPath: { path: /srv/immich/model-cache, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: home
spec:
  selector:
    app: immich-machine-learning
  ports:
    - port: 3003
