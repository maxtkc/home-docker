apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich-new
  namespace: home
  annotations:
    external-dns.alpha.kubernetes.io/target: kcfam.us
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`im.new.kcfam.us`)
      kind: Rule
      services:
        - name: immich-server
          port: 2283
  tls:
    secretName: new-kcfam-us-tls
---
## im.kcfam.us is reached through a per-host passthrough in Docker Traefik. Its
## CNAME predates external-dns, so this route carries no target annotation.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich
  namespace: home
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`im.kcfam.us`)
      kind: Rule
      services:
        - name: immich-server
          port: 2283
  tls:
    secretName: im-kcfam-us-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: im-kcfam-us-tls
  namespace: home
spec:
  secretName: im-kcfam-us-tls
  dnsNames:
    - im.kcfam.us
  issuerRef:
    name: letsencrypt-porkbun
    kind: ClusterIssuer
