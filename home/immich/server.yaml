## One container runs both the API and the microservices worker.
## Originals from the old Nextcloud tree are mounted read-write at /mnt/photos
## (deleting an asset removes its file; otherwise the next scan re-imports it);
## Immich's own uploads, thumbnails and encoded video live in /srv/immich/upload.
## System settings, OAuth included, come from immich.yaml in the immich-config
## Secret (sops edit home/immich/immich-config.enc.yaml), so the admin UI shows
## them read-only. Bump config-revision after editing it. Login is Keycloak only;
## break-glass is setting passwordLogin.enabled there.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
      annotations:
        config-revision: "4"
    spec:
      containers:
        - name: server
          image: ghcr.io/immich-app/immich-server:v3.3.0
          env:
            - name: DB_HOSTNAME
              value: immich-postgres
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_USERNAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: DB_PASSWORD
            - name: REDIS_HOSTNAME
              value: immich-redis
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
            - name: TZ
              value: America/New_York
            - name: IMMICH_CONFIG_FILE
              value: /config/immich.yaml
          ports:
            - containerPort: 2283
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - { name: upload, mountPath: /usr/src/app/upload }
            - { name: photos, mountPath: /mnt/photos }
            - { name: config, mountPath: /config, readOnly: true }
      volumes:
        - name: config
          secret:
            secretName: immich-config
        - name: upload
          hostPath: { path: /srv/immich/upload, type: Directory }
        - name: photos
          hostPath: { path: /srv/photos, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: home
spec:
  selector:
    app: immich-server
  ports:
    - port: 2283
