## Syncthing over /srv/files, mounted at the same path so folder paths read the
## same inside and out. The entrypoint drops to uid 1000, the owner of /srv/files.
## The sync protocol is a host port (22000 tcp/udp, 21027/udp for LAN discovery);
## the GUI is sync.kcfam.us (ingress.yaml), behind oauth2-proxy for `admins`.
##
## The GUI has no login of its own: the init container strips the GUI user and
## password on every start and skips the host check, and the NetworkPolicy lets
## only Traefik reach :8384. Device key and folders are kept.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-config
  namespace: home
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  namespace: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: gui-config
          image: syncthing/syncthing:2.1.6
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cfg=/var/syncthing/config/config.xml
              # insecureAdminAccess only silences the GUI's no-password warning.
              sed -i -e '/<gui /,/<\/gui>/{/<user>/d;/<password>/d;/<insecureSkipHostcheck>/d;/<insecureAdminAccess>/d;}' \
                -e '/<address>0.0.0.0:8384<\/address>/a\        <insecureSkipHostcheck>true</insecureSkipHostcheck>\n        <insecureAdminAccess>true</insecureAdminAccess>' "$cfg"
              grep -q '<insecureSkipHostcheck>true' "$cfg"
              grep -q '<insecureAdminAccess>true' "$cfg"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - { name: config, mountPath: /var/syncthing }
      containers:
        - name: syncthing
          image: syncthing/syncthing:2.1.6
          env:
            - name: TZ
              value: America/New_York
          ports:
            - { name: gui, containerPort: 8384 }
            - { name: sync-tcp, containerPort: 22000, hostPort: 22000, protocol: TCP }
            - { name: sync-udp, containerPort: 22000, hostPort: 22000, protocol: UDP }
            - { name: discovery, containerPort: 21027, hostPort: 21027, protocol: UDP }
          readinessProbe:
            httpGet:
              path: /rest/noauth/health
              port: 8384
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - { name: config, mountPath: /var/syncthing }
            - { name: files, mountPath: /srv/files }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: syncthing-config
        - name: files
          hostPath: { path: /srv/files, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: syncthing
  namespace: home
spec:
  selector:
    app: syncthing
  ports:
    - port: 8384
---
## :8384 (GUI and REST API, no login) only from Traefik; the sync and discovery
## host ports stay open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: syncthing
  namespace: home
spec:
  podSelector:
    matchLabels:
      app: syncthing
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - { port: 8384, protocol: TCP }
    - ports:
        - { port: 22000, protocol: TCP }
        - { port: 22000, protocol: UDP }
        - { port: 21027, protocol: UDP }
