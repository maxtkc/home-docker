## restic into the existing /mnt/backups/restic repo, the one Docker's
## restic-data also writes (same password). Snapshots carry host `home-k8s`, so
## forget only ever selects this job's own snapshots.
##
## Sources are mounted at their host paths so snapshot paths match the host.
## /dumps is where per-database pg_dump initContainers write. Dumps are
## uncompressed (-Z0) so restic can deduplicate them day to day.
##
## Times avoid restic-data (02:00 daily) and restic-check (Sunday 05:00).
## --retry-lock waits out the other writer's exclusive lock during prune/check.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-backup
  namespace: home
spec:
  schedule: "30 3 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: dump-immich
              image: ghcr.io/immich-app/postgres:14-vectorchord1.1.1-pgvector0.8.5
              command: ["pg_dump", "-h", "immich-postgres", "-U", "immich", "-d", "immich",
                        "-Fc", "-Z0", "-f", "/dumps/immich.dump"]
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-db
                      key: DB_PASSWORD
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - { name: dumps, mountPath: /dumps }
          containers:
            - name: restic
              image: restic/restic:0.18.1
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  restic backup --host home-k8s --tag home --retry-lock 2h \
                    --exclude /srv/immich/model-cache \
                    /srv/photos /srv/immich /srv/files /dumps
                  restic forget --host home-k8s --retry-lock 2h --prune \
                    --keep-daily 7 --keep-weekly 4 --keep-monthly 6
              env:
                - name: RESTIC_REPOSITORY
                  value: /mnt/backups/restic
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic
                      key: RESTIC_PASSWORD
                - name: RESTIC_CACHE_DIR
                  value: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              volumeMounts:
                - { name: repo, mountPath: /mnt/backups/restic }
                - { name: cache, mountPath: /cache }
                - { name: dumps, mountPath: /dumps }
                - { name: photos, mountPath: /srv/photos, readOnly: true }
                - { name: immich, mountPath: /srv/immich, readOnly: true }
                - { name: files, mountPath: /srv/files, readOnly: true }
          volumes:
            - name: repo
              hostPath: { path: /mnt/backups/restic, type: Directory }
            # Cache on /srv, not in an emptyDir on the tight /var.
            - name: cache
              hostPath: { path: /srv/restic-cache, type: DirectoryOrCreate }
            # Dumps on /srv too; the last one stays on the host between runs.
            - name: dumps
              hostPath: { path: /srv/backup-dumps, type: DirectoryOrCreate }
            - name: photos
              hostPath: { path: /srv/photos, type: DirectoryOrCreate }
            - name: immich
              hostPath: { path: /srv/immich, type: DirectoryOrCreate }
            - name: files
              hostPath: { path: /srv/files, type: DirectoryOrCreate }
---
## Reads back 5% of pack data each week, so the whole repo is re-read about
## every five months.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-check
  namespace: home
spec:
  schedule: "0 5 * * 6"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: restic
              image: restic/restic:0.18.1
              args: ["check", "--retry-lock", "2h", "--read-data-subset=5%"]
              env:
                - name: RESTIC_REPOSITORY
                  value: /mnt/backups/restic
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic
                      key: RESTIC_PASSWORD
                - name: RESTIC_CACHE_DIR
                  value: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              volumeMounts:
                - { name: repo, mountPath: /mnt/backups/restic }
                - { name: cache, mountPath: /cache }
          volumes:
            - name: repo
              hostPath: { path: /mnt/backups/restic, type: Directory }
            - name: cache
              hostPath: { path: /srv/restic-cache, type: DirectoryOrCreate }
---
## Copies home-k8s snapshots from the local repo to B2. Retention matches
## restic-backup exactly, so copy never re-uploads a snapshot B2 already forgot.
## The B2 repo shares the local repo's passphrase and chunker params, so the
## copy deduplicates.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-offsite
  namespace: home
spec:
  schedule: "0 6 * * *"
  timeZone: America/New_York
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: restic
              image: restic/restic:0.18.1
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  restic cat config >/dev/null 2>&1 || restic init --copy-chunker-params
                  restic copy --host home-k8s --retry-lock 3h
                  restic forget --host home-k8s --retry-lock 3h --prune \
                    --keep-daily 7 --keep-weekly 4 --keep-monthly 6
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:s3.us-east-005.backblazeb2.com/kcfam-restic
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic
                      key: RESTIC_PASSWORD
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: restic-b2
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: restic-b2
                      key: AWS_SECRET_ACCESS_KEY
                - name: RESTIC_FROM_REPOSITORY
                  value: /mnt/backups/restic
                - name: RESTIC_FROM_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic
                      key: RESTIC_PASSWORD
                - name: RESTIC_CACHE_DIR
                  value: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              volumeMounts:
                # Read-write: copy takes a lock in the source repo.
                - { name: repo, mountPath: /mnt/backups/restic }
                - { name: cache, mountPath: /cache }
          volumes:
            - name: repo
              hostPath: { path: /mnt/backups/restic, type: Directory }
            - name: cache
              hostPath: { path: /srv/restic-cache, type: DirectoryOrCreate }
---
## Reads back 2% of the B2 repo's pack data each month.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-offsite-check
  namespace: home
spec:
  schedule: "0 7 1 * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: restic
              image: restic/restic:0.18.1
              args: ["check", "--retry-lock", "3h", "--read-data-subset=2%"]
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:s3.us-east-005.backblazeb2.com/kcfam-restic
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic
                      key: RESTIC_PASSWORD
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: restic-b2
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: restic-b2
                      key: AWS_SECRET_ACCESS_KEY
                - name: RESTIC_CACHE_DIR
                  value: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              volumeMounts:
                - { name: cache, mountPath: /cache }
          volumes:
            - name: cache
              hostPath: { path: /srv/restic-cache, type: DirectoryOrCreate }
