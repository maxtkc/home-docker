apiVersion: v1
kind: ConfigMap
metadata:
  name: tgtg-env
  namespace: home
data:
  TZ: Europe/Berlin
  SLEEP_TIME: '180'
  PORT: '3000'
  METRICS: 'true'
  METRICS_PORT: '8000'
  PRICE_MONITORING: 'true'
  TELEGRAM: 'true'
  TELEGRAM_BODY: "*${{display_name}}* \n*Available*: ${{items_available}}\n*Price*: ${{price}} of ${{value}}\n*Pickup*: ${{pickupdate}}\n*Rating*: ${{rating}}\n*Link*: ${{link}}\n*Location*: [Map](https://www.google.com/maps/dir/?api=1&destination=${{pickup_location}}&travelmode=walking)"
  # DataDome 403s the latest Play Store version (26.10.0); 26.2.10 passes.
  TGTG_APK_VERSION: '26.2.10'
  HTTPS_PROXY: http://gluetun:8888
  NO_PROXY: api.telegram.org,localhost,gluetun
  TGTG_TOKEN_PATH: /tokens
