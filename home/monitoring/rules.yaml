## Alerts ported from prometheus/alerts.yml. Only alerts with notify=telegram
## reach Telegram (see alertmanager-home.enc.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: home
  namespace: home
spec:
  groups:
    - name: disk
      rules:
        # df-based, so it counts deleted-but-still-open files. /srv holds
        # Longhorn, which stops scheduling at 25% free, so it alerts earliest.
        - alert: DiskSpaceLow
          expr: |
            node_filesystem_avail_bytes{mountpoint="/srv"}
              / node_filesystem_size_bytes{mountpoint="/srv"} < 0.15
            or
            node_filesystem_avail_bytes{mountpoint=~"/|/var|/mnt/backups"}
              / node_filesystem_size_bytes{mountpoint=~"/|/var|/mnt/backups"} < 0.10
          for: 10m
          labels:
            severity: critical
            notify: telegram
          annotations:
            summary: "{{ $labels.mountpoint }} is low on space"
            description: >-
              {{ $labels.mountpoint }} is at
              {{ $value | humanizePercentage }} free on {{ $labels.instance }}.
              /var holds the k3s image store; /srv holds Docker and Longhorn.

        - alert: DiskFillingFast
          expr: |
            predict_linear(
              node_filesystem_avail_bytes{mountpoint=~"/var|/srv"}[6h], 4 * 3600
            ) < 0
          for: 30m
          labels:
            severity: warning
            notify: telegram
          annotations:
            summary: "{{ $labels.mountpoint }} is filling and will be full within 4h"
            description: >-
              Extrapolating the last 6h, {{ $labels.mountpoint }} on
              {{ $labels.instance }} runs out of space within 4 hours.

    - name: backups
      rules:
        # restic-backup runs daily at 03:30, restic-offsite (to B2) at 06:00.
        - alert: BackupStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="home", cronjob=~"restic-backup|restic-offsite"} > 36 * 3600
          for: 10m
          labels:
            severity: critical
            notify: telegram
          annotations:
            summary: "No successful {{ $labels.cronjob }} run in over 36h"
            description: >-
              {{ $labels.cronjob }} last succeeded {{ $value | humanizeDuration }} ago.

        - alert: BackupMetricMissing
          expr: |
            absent(kube_cronjob_status_last_successful_time{namespace="home", cronjob="restic-backup"})
            or
            absent(kube_cronjob_status_last_successful_time{namespace="home", cronjob="restic-offsite"})
          for: 6h
          labels:
            severity: warning
            notify: telegram
          annotations:
            summary: "{{ $labels.cronjob }} has no recorded successful run"
            description: >-
              kube-state-metrics reports no last successful time for the
              {{ $labels.cronjob }} CronJob.

        - alert: BackupJobFailed
          expr: kube_job_status_failed{namespace="home", job_name=~"restic-.*"} > 0
          for: 10m
          labels:
            severity: warning
            notify: telegram
          annotations:
            summary: "Job {{ $labels.job_name }} failed"
            description: >-
              kubectl -n home logs job/{{ $labels.job_name }}

    - name: pods
      rules:
        - alert: HomePodNotReady
          expr: |
            sum by (pod) (kube_pod_status_ready{namespace="home", condition="false"}) > 0
            unless on (pod) kube_pod_status_phase{namespace="home", phase="Succeeded"} > 0
          for: 15m
          labels:
            severity: warning
            notify: telegram
          annotations:
            summary: "{{ $labels.pod }} is not ready"
            description: >-
              {{ $labels.pod }} in home has not been ready for 15 minutes.

    - name: tgtg
      rules:
        - alert: TgtgScanStale
          expr: time() - tgtg_last_scan_success_timestamp_seconds > 3600
          for: 5m
          labels:
            severity: warning
            notify: telegram
          annotations:
            summary: "tgtg has not completed a scan in over an hour"
            description: >-
              Last successful TGTG request was {{ $value | humanizeDuration }} ago.
              If the tgtg bot reports 403s, send it /vpn new or /vpn Germany.
