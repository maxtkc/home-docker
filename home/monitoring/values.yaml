# kube-prometheus-stack for the home namespace (chart pinned in
# apps/home-monitoring.yaml). Secrets, rules, the dashboard and routes are in
# the home-monitoring-config app (this directory's kustomization).

# k3s runs these inside the k3s binary; there is nothing to scrape.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: 9GB
    # Pick up every ServiceMonitor and PrometheusRule, not only the chart's.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    # alertmanager.yaml and telegram_token, from alertmanager-home.enc.yaml. The
    # config routes only notify=telegram alerts and reads the token from
    # /etc/alertmanager/secrets/alertmanager-home/telegram_token.
    configSecret: alertmanager-home
    secrets:
      - alertmanager-home
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi

grafana:
  admin:
    existingSecret: grafana-admin
  # GF_AUTH_GITHUB_CLIENT_ID/SECRET and GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET.
  envFromSecrets:
    - name: grafana-github
    - name: grafana-oidc
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 1Gi
  grafana.ini:
    server:
      root_url: https://gf.kcfam.us
    users:
      allow_sign_up: false
    auth.github:
      enabled: true
      scopes: user:email,read:org
      allow_sign_up: true
      allowed_users: maxtkc
      skip_org_role_sync: true
    # Keycloak realm kcfam; only realm users get this far.
    auth.generic_oauth:
      enabled: true
      name: kcfam
      client_id: grafana
      scopes: openid email profile
      auth_url: https://id.kcfam.us/realms/kcfam/protocol/openid-connect/auth
      token_url: https://id.kcfam.us/realms/kcfam/protocol/openid-connect/token
      api_url: https://id.kcfam.us/realms/kcfam/protocol/openid-connect/userinfo
      signout_redirect_url: https://id.kcfam.us/realms/kcfam/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgf.kcfam.us%2Flogin
      login_attribute_path: preferred_username
      email_attribute_path: email
      groups_attribute_path: groups
      role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
      allow_sign_up: true
      use_pkce: true
    auth:
      oauth_allow_insecure_email_lookup: true
