## nginx serving max.kcfam.us. The personal-site Forgejo workflow writes the
## build into the nextcloud_static_sites Docker volume, mounted here read-only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: static-sites
  namespace: home
data:
  default.conf: |
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
      listen 8080;
      root /sites;

      location ~* \.(css|js|woff2|woff|ttf|webp|png|jpg|jpeg|gif|ico|svg|json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
      }

      location / {
        try_files $uri $uri/ /index.html =404;
        add_header Cache-Control "public, max-age=3600";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-sites
  namespace: home
spec:
  replicas: 1
  selector:
    matchLabels:
      app: static-sites
  template:
    metadata:
      labels:
        app: static-sites
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: site, mountPath: /sites, readOnly: true }
      volumes:
        - name: conf
          configMap:
            name: static-sites
        - name: site
          hostPath: { path: /srv/docker/volumes/nextcloud_static_sites/_data/max.kcfam.us, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: static-sites
  namespace: home
spec:
  selector:
    app: static-sites
  ports:
    - port: 80
      targetPort: http
