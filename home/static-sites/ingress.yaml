apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: static-sites-new
  namespace: home
  annotations:
    external-dns.alpha.kubernetes.io/target: kcfam.us
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`max.new.kcfam.us`)
      kind: Rule
      services:
        - name: static-sites
          port: 80
  tls:
    secretName: new-kcfam-us-tls
---
## max.kcfam.us is reached through a per-host passthrough in Docker Traefik. Its
## CNAME predates external-dns, so this route carries no target annotation.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: static-sites
  namespace: home
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`max.kcfam.us`)
      kind: Rule
      services:
        - name: static-sites
          port: 80
  tls:
    secretName: max-kcfam-us-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: max-kcfam-us-tls
  namespace: home
spec:
  secretName: max-kcfam-us-tls
  dnsNames:
    - max.kcfam.us
  issuerRef:
    name: letsencrypt-porkbun
    kind: ClusterIssuer
