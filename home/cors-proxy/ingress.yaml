apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cors-proxy-new
  namespace: home
  annotations:
    external-dns.alpha.kubernetes.io/target: kcfam.us
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`cors.new.kcfam.us`)
      kind: Rule
      services:
        - name: cors-proxy
          port: 80
  tls:
    secretName: new-kcfam-us-tls
---
## cors.kcfam.us is reached through a per-host passthrough in Docker Traefik. Its
## CNAME predates external-dns, so this route carries no target annotation.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cors-proxy
  namespace: home
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`cors.kcfam.us`)
      kind: Rule
      services:
        - name: cors-proxy
          port: 80
  tls:
    secretName: cors-kcfam-us-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cors-kcfam-us-tls
  namespace: home
spec:
  secretName: cors-kcfam-us-tls
  dnsNames:
    - cors.kcfam.us
  issuerRef:
    name: letsencrypt-porkbun
    kind: ClusterIssuer
