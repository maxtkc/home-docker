# Keycloak (id.kcfam.us) and oauth2-proxy (auth.kcfam.us).
#
# kcfam-realm.json is applied to the live realm by the keycloak-config-cli
# PostSync Job on every sync, so console edits to anything it declares are
# reverted; change the file instead. Users are not in it: create them in the
# admin console or API (their IdP links are made at login). Keycloak rejects
# unknown fields, so the JSON holds no comments; notes live here:
#
# - $(env:KC_...) placeholders are filled by config-cli from the `auth` Secret.
# - The three IdPs use the `link existing only` first-broker-login flow: a
#   brokered login attaches to the realm user with the same email, anyone else
#   is refused. New people are added as realm users first.
# - trustEmail is on because the flow links only on a verified email; Google,
#   GitHub and LinkedIn release only addresses they have verified.
# - No pkce attribute on clients that do not send a code_challenge (Grafana,
#   File Browser, Immich), or their logins fail.
# - Defining clientScopes here would stop Keycloak creating the built-in ones
#   (email, profile, roles), so the groups mapper sits on each client instead.
# - Groups: `family` (oauth2-family, Grafana Viewer, File Browser), `admins`
#   (oauth2-admins, Grafana Admin, File Browser admin), `gramps` (GrampsWeb).
#   Relatives with only a GrampsWeb account are in `gramps` alone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generators:
  - secret-generator.yaml
resources:
  - postgres.yaml
  - keycloak.yaml
  - keycloak-config-cli.yaml
  - oauth2-proxy.yaml
  - ingress.yaml
configMapGenerator:
  - name: keycloak-realm
    namespace: home
    files:
      - kcfam-realm.json
